<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala de Vacina · UBS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Sala de Vacina</h1>
    <nav>
      <button data-aba="dashboard">Dashboard</button>
      <button data-aba="consultas">Consultas</button>
      <button data-aba="pacientes">Pacientes</button>
      <button data-aba="estoque">Estoque</button>
      <button data-aba="lotes">Lotes</button>
      <button data-aba="profissionais">Profissionais</button>
      <button data-aba="rotinas">Rotinas do banco</button>
    </nav>
  </header>
  <main>
    <section id="aba-dashboard" class="aba"></section>
    <section id="aba-consultas" class="aba"></section>
    <section id="aba-pacientes" class="aba"></section>
    <section id="aba-estoque" class="aba"></section>
    <section id="aba-lotes" class="aba"></section>
    <section id="aba-profissionais" class="aba"></section>
    <section id="aba-rotinas" class="aba"></section>
  </main>
  <div hidden>
    <form id="form-excluir" style="display: flex; flex-direction: column; align-items: stretch; gap: 16px; margin: 0;">
      <p id="msg-excluir" style="margin: 0; font-size: 16px; color: #1c2430;"></p>
      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
        <button type="button" id="cancelar-excluir" class="secundario">Cancelar</button>
        <button type="submit" class="perigo">Sim, confirmar</button>
      </div>
    </form>
  </div>
  <div id="modal-fundo" class="modal-oculto">
    <div id="modal-caixa">
      <div class="modal-cabecalho">
        <h2 id="modal-titulo">Editar</h2>
        <button type="button" id="modal-fechar">&times;</button>
      </div>
      <div id="modal-conteudo">
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/consultas.js"></script>
  <script src="js/pacientes.js"></script>
  <script src="js/estoque.js"></script>
  <script src="js/lotes.js"></script>
  <script src="js/profissionais.js"></script>
  <script src="js/rotinas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
